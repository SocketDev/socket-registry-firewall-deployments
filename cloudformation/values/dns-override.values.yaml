# Socket Firewall — Helm values: DNS-override deployment (example)
#
# DNS-override routing: point internal DNS for the registry hostnames at the
# firewall, and the firewall presents self-signed certs for those hostnames.
#   - DNS-override routing
#   - Self-signed certs at the endpoints (distribute the CA to clients)
#   - Redis caching enabled (backed by the ElastiCache stack)
#   - Fail-open if Socket's decision service is unavailable
#
# Behavioral defaults below are kept in sync with helm/values.yaml.
# Adjust the ecosystem list and Redis TLS settings to your environment.
# Chart: ../helm

replicaCount: 2

image:
  repository: socketdev/socket-registry-firewall
  # Pin explicitly so CloudFormation installs don't drift if the chart
  # appVersion changes independently. Never use :latest for a security product.
  tag: "2.3.3"
  pullPolicy: Always

socket:
  # Injected at install time from AWS Secrets Manager by the CloudFormation
  # stack (helm --set socket.apiToken=...). Do not commit the token.
  apiToken: ""
  failOpen: true            # fail open if the Socket API is unavailable
  failOpenUnscanned: true
  useRemoteConfig: false
  configRefreshInterval: "60s"
  bearerTokenType: "string"
  saveIgnoreReason: false
  requestIdHeader: "X-Socket-Request-ID"
  exposeUnscannedHeader: false
  cacheTtl: 600
  logMaxBodySize: 3900
  logNoRoute: true
  debugLoggingEnabled: false
  rewritePackageUrls: true
  # Empty = enforced globally per Socket API severity.
  # Valid: npm, pypi, maven, cargo, rubygems, nuget, go, conda, openvsx, huggingface
  recentlyPublishedEnabledEcosystems: []
  apiSslVerify: true
  # Socket API timeouts (seconds). null inherits firewall defaults.
  apiReadTimeout: null
  apiConnectTimeout: null
  apiSendTimeout: null
  ecosystemParams: {}
  # Circuit breaker for the Socket /purl verdict API (matches helm/values.yaml).
  resilience:
    circuitBreaker:
      enabled: true
      latencyEwmaThresholdMs: 10000
      ewmaAlpha: 0.3
      errorRateThreshold: 0.5
      errorMinRequests: 20
      errorWindowS: 10
      openWindowS: 30
      maxOpenWindowS: 300
      backoffFactor: 2
      halfopenProbes: 3
      halfopenProbeSpacingS: 1
      probeTimeoutMs: 10000

# Cache freshness / revalidation (matches helm/values.yaml).
cache:
  revalidationLockLeaseSeconds: 0
  revalidationJitterSeconds: 120
  revalidationAsync: false
  confirmAllowMode: wait
  # Opt-in proactive warming (requires Redis — already enabled below).
  warmEnabled: false
  warmInterval: 60

keepaliveTimeout: 65

# DNS-override mode: the firewall presents certs for the real registry hostnames,
# and internal DNS for those hostnames points at the firewall's load balancer.
dnsRouting:
  enabled: true
  registries:
    - npm
    - pypi
  # add as needed: maven, cargo, rubygems, openvsx, nuget, go, conda, huggingface

# Self-signed CA generated by the chart's init container; SANs cover the
# dnsRouting hostnames automatically. Distribute the CA to client endpoints.
tls:
  generateSelfSigned: true

# Redis caching backed by the ElastiCache replication group provisioned by
# the CloudFormation stack. Host is injected at install time (--set redis.host=...).
redis:
  enabled: true
  host: ""                  # set to the ElastiCache primary endpoint by the stack
  port: 6379
  ssl: true                 # ElastiCache transit encryption
  sslVerify: true           # if the image doesn't trust Amazon's CA, mount it or set false
  ttl: 86400
  db: 0
  timeout: 1000
  poolSize: 100

# Metadata filtering off by default (matches helm/values.yaml). Enable when ready.
metadataFiltering:
  enabled: false
  filterBlocked: true
  filterWarn: false
  includeUncheckedVersions: true
  maxVersions: 100
  cacheTtl: 3600
  batchSize: 100
  maxBodySize: "500m"
  excludedEcosystems: []
  prefetchEnabled: false
  prefetchTtl: 600
  prefetchMaxConcurrent: 2
  prefetchBatchConcurrency: 4
  metadataConcurrentBatch: 4
  condaPrefetchArchs: []
  maxConcurrent: 3
  packageFilterTimeout: 60
  semaphoreWaitTimeout: 60
  packageFilterRetry: 0
  responseCacheEnabled: false
  responseCacheTtl: 600
  responseCacheFresh: 60
  cacheAuthenticated: false
  responseCacheExcludedEcosystems: []
  confirmAllowMode: wait

# External registry cooldown off by default (matches helm/values.yaml).
externalRegistryCooldown:
  enabled: false
  enablePublicQuery: false
  cooldownPeriod: "7d"
  checkInterval: "60s"
  redisKeyPrefix: "cooldown:"
  cacheTtl: 86400
  mode: ""
  fallback: ""
  registries: []

# Prometheus /metrics (matches helm/values.yaml).
metrics:
  enabled: true
  minImageVersion: "1.1.343"
  port: 9145
  podAnnotations: false
  serviceMonitor:
    enabled: false

# Expose via an internal load balancer so internal DNS can target it.
service:
  type: LoadBalancer
  httpPort: 80
  httpsPort: 443
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Sized for metadata filtering headroom (matches helm/values.yaml defaults).
resources:
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 8Gi

healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: socket-firewall
          topologyKey: kubernetes.io/hostname
