{{- if and .Values.socket.apiToken (not .Values.socket.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-api-token
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  SOCKET_SECURITY_API_TOKEN: {{ .Values.socket.apiToken | quote }}
{{- end }}
{{- if and .Values.socket.bearerToken (not .Values.socket.bearerTokenExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-bearer-token
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.socket.bearerTokenExistingSecretKey }}: {{ .Values.socket.bearerToken | quote }}
{{- end }}
{{- if and .Values.socket.basicAuthPassword (not .Values.socket.basicAuthExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-basic-auth
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.socket.basicAuthExistingSecretKey }}: {{ .Values.socket.basicAuthPassword | quote }}
{{- end }}
{{- if and .Values.redis.enabled .Values.redis.password (not .Values.redis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-redis
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
{{- end }}
{{- if and .Values.splunk.enabled .Values.splunk.hecToken (not .Values.splunk.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-splunk
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPLUNK_HEC_TOKEN: {{ .Values.splunk.hecToken | quote }}
{{- end }}
{{- if and .Values.webhook.enabled .Values.webhook.authHeader (not .Values.webhook.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-webhook
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.webhook.existingSecretKey }}: {{ .Values.webhook.authHeader | quote }}
{{- end }}
{{- with .Values.pathRouting }}
{{- if and .enabled .privateRegistry.enabled (or .privateRegistry.apiKey .privateRegistry.password) (not .privateRegistry.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" $ }}-private-registry
  labels:
    {{- include "socket-firewall.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- if .privateRegistry.apiKey }}
  {{ .privateRegistry.existingSecretKey }}: {{ .privateRegistry.apiKey | quote }}
  {{- end }}
  {{- if .privateRegistry.password }}
  {{ .privateRegistry.existingSecretPasswordKey }}: {{ .privateRegistry.password | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.tls.certificate .Values.tls.privateKey (not .Values.tls.existingSecret) (not .Values.tls.generateSelfSigned) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "socket-firewall.fullname" . }}-tls
  labels:
    {{- include "socket-firewall.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.certificate }}
  tls.key: {{ .Values.tls.privateKey }}
{{- end }}
