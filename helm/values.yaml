# Socket Firewall Helm Chart Values

# Image configuration
image:
  repository: socketdev/socket-registry-firewall
  # Keep in sync with Chart.yaml appVersion. Leave empty only if you intentionally
  # want to track whatever appVersion the installed chart carries.
  tag: "2.0.14"
  pullPolicy: Always

# Image pull secrets for private registries
imagePullSecrets: []
# - name: my-registry-secret

# Number of replicas (ignored if autoscaling is enabled)
replicaCount: 1

# Pod Disruption Budget (keeps pods available during node maintenance)
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1  # Alternative to minAvailable

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

# Socket API configuration
socket:
  # API token for Socket.dev (required)
  # Required scopes: packages, entitlements:list
  # Set via --set socket.apiToken=xxx or create secret manually
  apiToken: ""
  # Name of existing secret containing SOCKET_SECURITY_API_TOKEN
  existingSecret: ""
  existingSecretKey: "SOCKET_SECURITY_API_TOKEN"
  # Allow package downloads if Socket API is unavailable (default: true)
  # Set to false for strict security (blocks all packages if API is down)
  failOpen: true
  # Allow packages Socket has not yet scanned
  failOpenUnscanned: true
  # Pull config from Socket dashboard (wholesale overrides values.yaml settings)
  useRemoteConfig: false
  # Remote config refresh interval (only used when useRemoteConfig=true)
  configRefreshInterval: "60s"
  # Bearer token interpretation: "string" (literal token) or "env" (env var name)
  bearerTokenType: "string"
  # Client auth gate: require inbound requests to present a matching
  # "Authorization: Bearer <token>" header. Leave empty to disable the gate
  # (the default). When set, the token is mounted into the pod as the
  # SOCKET_BEARER_TOKEN env var, which the firewall reads at startup.
  bearerToken: ""
  # Name of an existing secret containing the bearer token (mutually exclusive
  # with bearerToken; use this to avoid putting the token in values)
  bearerTokenExistingSecret: ""
  bearerTokenExistingSecretKey: "SOCKET_BEARER_TOKEN"
  # Send usage/decision telemetry to Socket (batched /v1 events endpoint)
  telemetryEnabled: true
  # Include ignore_reason in decision events sent to telemetry/webhook/splunk
  saveIgnoreReason: false
  # Header echoed in logs/telemetry for request correlation
  requestIdHeader: "X-Socket-Request-ID"
  # Add X-Socket-Unscanned header to allowed unscanned packages
  exposeUnscannedHeader: false
  # Cache TTL for Socket API responses in seconds (default: 600 = 10 minutes)
  cacheTtl: 600
  # Log level (default: info). Valid: error, warn, info, debug
  logLevel: ""
  # Max bytes per SOCKET_DECISION log line (0 disables splitting)
  logMaxBodySize: 3900
  # Emit access logs for NO_ROUTE requests
  logNoRoute: true
  # Force-enable debug logging (auto-enabled when logLevel=debug)
  debugLoggingEnabled: false
  # Rewrite download/package URLs in metadata responses (e.g. Cargo config.json)
  rewritePackageUrls: true
  # Ecosystems where recentlyPublished alerts are enforced.
  # Empty list = enforced globally per Socket API severity.
  # Valid: npm, pypi, maven, cargo, rubygems, nuget, go, conda, openvsx, huggingface
  recentlyPublishedEnabledEcosystems: []

  # Socket API endpoint. Empty uses the firewall default (https://api.socket.dev).
  apiUrl: ""
  # Verify outbound TLS to the Socket API.
  apiSslVerify: true
  # Override CA (file path) for Socket API calls. Empty uses ssl.caCert bundle / system trust.
  apiSslCaCert: ""
  # Verify outbound TLS to upstream registries. Leave null to inherit apiSslVerify.
  upstreamSslVerify: null
  # Override CA (file path) for upstream registry calls. Empty uses ssl.caCert bundle / system trust.
  upstreamSslCaCert: ""
  # Outbound HTTP proxy applied to Socket API + registry traffic.
  outboundProxy: ""
  # Comma-separated host list bypassing outboundProxy.
  noProxy: ""
  # Named deployment/config in the Socket dashboard (used with useRemoteConfig / cooldown api mode).
  deployment: ""
  # Client auth gate — HTTP basic auth. Rendered into the ConfigMap (not a Secret).
  basicAuthUsername: ""
  basicAuthPassword: ""
  # Token guarding the authenticated health endpoint. Empty leaves it unauthenticated
  # (falls back to the SOCKET_HEALTH_API_TOKEN env var).
  healthApiToken: ""
  # Restrict debug logging to requests whose User-Agent matches this glob (e.g. "*pip*").
  debugUserAgentFilter: ""
  # Socket API timeouts (seconds), split into connect/send/read phases so an
  # unreachable API fails fast on connect instead of burning the full read budget.
  # Leave null to inherit firewall defaults (read ← proxy.readTimeout; connect=5; send=10).
  apiReadTimeout: null
  apiConnectTimeout: null
  apiSendTimeout: null
  # Per-action log levels for SOCKET_DECISION output (error | warn | notice | info | debug).
  # Empty uses the firewall defaults (block=error, warn=warn, monitor=notice, ignore=debug).
  blockLogLevel: ""
  warnLogLevel: ""
  monitorLogLevel: ""
  ignoreLogLevel: ""
  # Per-ecosystem overrides. Each entry recognizes allow_unknown and use_private_created_at.
  # ecosystemParams:
  #   conda:
  #     use_private_created_at: true
  #     allow_unknown: true
  ecosystemParams: {}

  # API resilience — circuit breaker for the Socket /purl verdict API. When the
  # API is slow or erroring the breaker trips open and the firewall fast-fails
  # (serves cache / fail_open policy) instead of blocking each request on a
  # degraded API, then probes for recovery in the background. Thresholds are
  # optional; omit/leave defaults to use the firewall built-ins.
  resilience:
    circuitBreaker:
      enabled: true
      # Trip sensitivity
      latencyEwmaThresholdMs: 10000
      ewmaAlpha: 0.3
      errorRateThreshold: 0.5
      errorMinRequests: 20
      errorWindowS: 10
      # Fast-fail duration + recovery backoff while OPEN
      openWindowS: 30
      maxOpenWindowS: 300
      backoffFactor: 2
      # Recovery probing (HALF-OPEN)
      halfopenProbes: 3
      halfopenProbeSpacingS: 1
      probeTimeoutMs: 10000

# Cache freshness / revalidation (Socket API response cache). See socket.cacheTtl for ttl.
cache:
  # Lease held while revalidating a stale entry (seconds; 0 disables the lock).
  revalidationLockLeaseSeconds: 0
  # Jitter added to revalidation scheduling to avoid thundering herds (seconds).
  revalidationJitterSeconds: 120
  # false (default): on expiry the lock winner revalidates live (bounded by the
  # circuit breaker) instead of serving stale first. true restores serve-stale-
  # while-async-refresh. Expired ALLOWs are confirmed live regardless (see below).
  revalidationAsync: false
  # Confirm-stale-ALLOW: how an expired ALLOW is handled (a stale BLOCK is always
  # served stale). Valid: serve_stale | wait | confirm_when_degraded | fail_when_degraded
  confirmAllowMode: wait
  # Proactive cache warming (requires Redis; worker 0 only). Opt-in — disabled
  # by default; no-op when Redis is disabled.
  warmEnabled: false
  warmInterval: 60

# Top-level nginx keepalive timeout (seconds).
keepaliveTimeout: 65

# Upstream auth tokens. Two modes:
# If set, chart provisions a Secret <release>-upstream-tokens with these keys;
# routes/registries without `upstreamTokenSecret` default to it.
upstreamTokens:
  values: {}
  # NPM_AUTH_TOKEN: "npm_yourtokenhere"
  # PYPI_AUTH_TOKEN: "user:password"

# Path-based routing (recommended — single domain with path prefixes)
# See: https://docs.socket.dev/docs/registry-mode-configuration-reference
pathRouting:
  enabled: false
  domain: ""
  # Additional hostnames this server answers to beyond `domain` (exact names,
  # nginx wildcards like *.cluster.example.com, or a regex ~^.+$ catch-all).
  allowedDomain: []
  # Routing mode: local | artifactory | nexus | downstream. Empty = local (firewall default).
  mode: ""
  # config_mode: upstream or middle (omit for downstream, which is default)
  configMode: ""
  # FQDN of the upstream this firewall proxies to (artifactory/nexus/middle modes).
  upstreamFqdn: ""
  # Scheme used when rewriting package URLs. Empty = https (firewall default).
  rewriteScheme: ""
  # Scheme advertised to clients in rewritten URLs. Empty falls back to rewriteScheme.
  clientRewriteScheme: ""
  # Rewrite package URLs with the incoming Host instead of `domain`. Null = firewall default (false).
  useIncomingDomain: null
  # Emit X-Forwarded-For style domain forwarding. Null = firewall default (true).
  forwardForDomain: null
  # Override nginx location-block URL rewriting. Null = firewall default (false).
  overrideLocationRewrite: null
  # Advertise non-standard ports in rewritten URLs (e.g. "8080" / "8443").
  overridePortHttp: ""
  overridePortHttps: ""
  # Optional CSV file of routes, merged with the `routes` list below.
  routesFile: ""
  # upstreamToken / upstreamTokenSecret on a route enable upstream auth.
  # See: https://docs.socket.dev/docs/registry-mode-configuration-reference
  routes: []
  # - path: /npm
  #   upstream: https://registry.npmjs.org
  #   registry: npm
  #   upstreamToken: NPM_AUTH_TOKEN
  #   upstreamTokenSecret: socket-upstream-tokens
  #   # Advanced per-route keys (all optional):
  #   upstreamType: ""          # "" or "artifactory"
  #   upstreamHost: ""          # explicit upstream Host header
  #   mode: rewrite             # "rewrite" or "proxy"
  #   baseUrl: ""               # artifactory mode only
  #   artifactoryRepo: ""       # artifactory mode only
  #   cooldownName: ""          # ties route to an externalRegistryCooldown.registries[].name
  #   cooldownEcosystem: ""     # gradle, pypi, conda, ... (resolved from cooldownName if omitted)
  #   repoKey: ""               # private-registry repo key (defaults to cooldownName)
  # Auto-discovery of upstream repos in a Nexus/Artifactory instance.
  privateRegistry:
    enabled: false
    type: ""                    # 'nexus' or 'artifactory'
    apiUrl: ""
    apiKey: ""                  # also overridable via PRIVATE_REGISTRY_KEY env var
    username: ""
    password: ""
    interval: "5m"
    includePattern: ".*"
    excludePattern: "^$"
    ignoreSslErrors: false
    supportedEcosystemsOnly: true
    includeVirtual: false       # Nexus only
  # - path: /pypi
  #   upstream: https://pypi.org
  #   registry: pypi
  # - path: /maven
  #   upstream: https://repo1.maven.org/maven2
  #   registry: maven
  # - path: /cargo
  #   upstream: https://index.crates.io
  #   registry: cargo
  # - path: /rubygems
  #   upstream: https://rubygems.org
  #   registry: rubygems
  # - path: /openvsx
  #   upstream: https://open-vsx.org
  #   registry: openvsx
  # - path: /nuget
  #   upstream: https://api.nuget.org
  #   registry: nuget
  # - path: /go
  #   upstream: https://proxy.golang.org
  #   registry: go
  # - path: /conda
  #   upstream: https://conda.anaconda.org
  #   registry: conda
  # - path: /huggingface
  #   upstream: https://huggingface.co
  #   registry: huggingface

# Domain-based routing (alternative — each registry gets its own subdomain)
# Only used when pathRouting.enabled is false.
# upstreamToken / upstreamTokenSecret on a registry enable upstream auth.
# upstream on a registry overrides the default public upstream (e.g. an internal mirror).
registries:
  npm:
    enabled: false
    domains:
      - npm.company.local
    # upstream: https://registry.npmjs.org
    # upstreamToken: NPM_AUTH_TOKEN
    # upstreamTokenSecret: socket-upstream-tokens
  pypi:
    enabled: false
    domains:
      - pypi.firewall.local
  maven:
    enabled: false
    domains:
      - maven.firewall.local
  rubygems:
    enabled: false
    domains:
      - rubygems.firewall.local
  cargo:
    enabled: false
    domains:
      - cargo.firewall.local
  openvsx:
    enabled: false
    domains:
      - openvsx.firewall.local
  nuget:
    enabled: false
    domains:
      - nuget.firewall.local
  go:
    enabled: false
    domains:
      - go.firewall.local
  conda:
    enabled: false
    domains:
      - conda.firewall.local
  huggingface:
    enabled: false
    domains:
      - huggingface.firewall.local
    # upstream: https://huggingface.co
    # upstreamToken: HF_AUTH_TOKEN
    # upstreamTokenSecret: socket-upstream-tokens

# DNS override mode (transparent proxy with real registry hostnames pointed at the firewall)
#
# Can be combined with pathRouting for hybrid deployments (e.g., path routing for
# CI/CD systems that can be reconfigured, DNS override for developer laptops).
#
# Requires:
#   - Internal DNS control to reroute registry hostnames to the firewall
#   - TLS certificates that match the real registry hostnames (corporate CA or similar)
dnsRouting:
  enabled: false
  # List which registries to route via DNS override.
  # Supported values: npm, pypi, maven, cargo, rubygems, openvsx, nuget, go, conda, huggingface
  # Example: --set dnsRouting.enabled=true --set 'dnsRouting.registries={npm,pypi}'
  registries: []

# Proxy tuning
proxy:
  bufferSize: "16k"
  buffersCount: 8
  buffersSize: "16k"
  busyBuffersSize: "32k"
  connectTimeout: 60
  sendTimeout: 60
  readTimeout: 60
  # Request headers to strip before forwarding upstream (case-insensitive).
  # Empty list = strip nothing. e.g. ["Authorization", "Cookie"]
  stripRequestHeaders: []

# Nginx performance tuning
nginx:
  workerProcesses: 4
  workerConnections: 8192
  workerRlimitNofile: 2048
  keepalivePoolSize: 64
  typesHashMaxSize: 2048
  clientMaxBodySize: "100M"
  # Serialize connection acceptance across workers ("on" / "off").
  acceptMutex: "off"
  # Enable HTTP/2 on the TLS (HTTPS) listener.
  http2: true
  # DNS resolver for upstream name resolution (e.g. kube-dns "10.96.0.10").
  # Empty leaves the firewall to auto-detect (127.0.0.11 for Docker).
  resolver: ""
  resolverTimeout: "5s"
  # Access log buffer setting (default: not set, nginx uses its default)
  # Set to "off" to flush access log lines immediately to stdout
  accessLogBuffer: "off"
  gzip:
    enabled: "on"
    minLength: 1024
  openFileCache:
    max: 1000
    inactive: "60s"
  proxyCache:
    enabled: "on"
    path: /tmp/nginx_cache
    size: 100m
    inactive: 60m

# Listen ports. The container HTTP/HTTPS ports are normally set via service.* and
# the HTTP_PORT/HTTPS_PORT env vars; these keys additionally let you disable a
# listener entirely or override the port from within socket.yml.
ports:
  # Override the HTTP listen port inside socket.yml. Empty/null = use service defaults.
  http: null
  # Override the HTTPS listen port inside socket.yml. Empty/null = use service defaults.
  https: null
  # Disable the HTTP listener entirely.
  disableHttp: false
  # Disable the HTTPS listener entirely (incompatible with forwardProxy.enabled).
  disableHttps: false

# Server TLS paths inside socket.yml. Certificates are normally delivered via
# tls.existingSecret (mounted for you); set these only to override the on-disk
# paths or to merge a CA trust bundle (caCert) into the server's trust store.
ssl:
  cert: ""
  key: ""
  # CA bundle (file path) merged into the trust store — e.g. for corporate CAs.
  caCert: ""

# Lua shared-memory zone sizes (raise if cache/stats dictionaries fill up)
lua:
  cacheSize: "10m"
  statsSize: "1m"

# Client IP detection from forwarded headers (for deployments behind LBs/ingress)
# When header is empty, the nginx realip module is disabled.
clientIp:
  # Header to read for the real client IP (e.g., "X-Forwarded-For", "True-Client-IP")
  header: ""
  # CIDRs allowed to set the header
  trustedProxies: []
  # Walk the header to find the originating IP
  recursive: true

# HTTP CONNECT forward-proxy listener, for CASBs (e.g. Netskope/Zscaler in
# proxy-chaining mode) that reach upstreams via a CONNECT tunnel. Requires the
# official image (>= 1.1.275). See README "Forward Proxy (HTTP CONNECT)".
forwardProxy:
  enabled: false
  port: 3128
  # Hard cap on a single tunnel's lifetime (seconds).
  maxTunnelLifetimeSeconds: 600
  # Per-source-IP concurrent tunnel cap.
  maxConnectionsPerSource: 64
  # Internal loopback PROXY-protocol port (not exposed). Must differ from port.
  proxyProtocolPort: 8081
  # Set true only for a custom image you've confirmed supports stream-lua.
  skipStreamLuaCheck: false
  # Dedicated Service for the CONNECT port. CONNECT cannot pass through an L7
  # Ingress, so this must be a Layer-4 (TCP passthrough) load balancer.
  service:
    enabled: false
    type: LoadBalancer
    # Provider-specific L4 load balancer annotations, if any.
    annotations: {}
    # Fixed nodePort (30000-32767) when type=NodePort. Empty = auto-assign.
    nodePort: ""
    # External traffic policy (Cluster or Local). Only applies when type is
    # NodePort or LoadBalancer. Set to "Local" to preserve client source IPs,
    # which the CONNECT listener uses for the per-source-IP tunnel cap
    # (maxConnectionsPerSource) and for meaningful client IPs in logs. The
    # default "Cluster" policy SNATs cross-node traffic, so every tunnel appears
    # to originate from a node IP. Note: with "Local", only nodes running a
    # firewall pod receive traffic.
    externalTrafficPolicy: ""
    # Restrict source CIDRs that may reach the listener (e.g. CASB egress).
    loadBalancerSourceRanges: []

# Metadata filtering (removes blocked/warned packages from registry metadata responses)
metadataFiltering:
  enabled: false
  filterBlocked: true
  filterWarn: false
  includeUncheckedVersions: true
  maxVersions: 100
  cacheTtl: 3600
  batchSize: 100
  # Max response body size subject to filtering.
  maxBodySize: "500m"
  # Ecosystems to skip filtering for (empty = filter all supported ecosystems).
  excludedEcosystems: []
  # Prefetch conda metadata to warm the filter cache.
  prefetchEnabled: false
  prefetchTtl: 600
  prefetchMaxConcurrent: 2
  prefetchBatchConcurrency: 4
  # Max concurrent PURL batch API calls per inline metadata request.
  metadataConcurrentBatch: 4
  # Conda arches to prefetch (empty = firewall defaults: linux-64, linux-aarch64,
  # osx-64, osx-arm64, win-64, noarch).
  condaPrefetchArchs: []
  # Per-worker concurrent metadata filter operations.
  maxConcurrent: 3
  # Total time budget per metadata filter operation (seconds).
  packageFilterTimeout: 60
  # Max wait for a semaphore slot before giving up (seconds). Default tracks
  # min(60, packageFilterTimeout) so it matches a typical client request timeout.
  semaphoreWaitTimeout: 60
  # Retries for a failed PURL batch API call within the timeout budget (0 = none).
  packageFilterRetry: 0
  # Finished-response body cache (stale-while-revalidate over the filtered body).
  # Second staleness layer above the per-PURL verdict cache — keep OFF unless the
  # confirm-ALLOW safeguard below is understood. Defaults OFF deliberately.
  responseCacheEnabled: false
  responseCacheTtl: 600           # max_age (seconds) before a full re-filter; 0 = inherit cacheTtl
  responseCacheFresh: 60          # serve-without-upstream window (coalesces rapid repeats)
  # Cache responses that forward Authorization upstream (per-credential namespace).
  cacheAuthenticated: false
  responseCacheExcludedEcosystems: []
  # Confirm-stale-ALLOW for the response body cache. Valid:
  # serve_stale | wait | confirm_when_degraded | fail_when_degraded
  confirmAllowMode: wait

# Redis caching for Socket API lookups
redis:
  enabled: false
  host: redis
  port: 6379
  password: ""
  # Name of existing secret containing Redis password
  existingSecret: ""
  existingSecretKey: "REDIS_PASSWORD"
  db: 0
  timeout: 1000
  poolSize: 100
  ttl: 86400
  ssl: false
  sslVerify: true
  # TLS SNI server name presented to the Redis server (managed services may require this).
  sslServerName: ""
  # File path inside the container for the Redis CA certificate.
  # Use sslCaCertExistingSecret below to have the chart mount a secret
  # for you. Set sslCaCert directly only if you are delivering the file
  # via your own volume/init container.
  sslCaCert: ""
  # Mount a CA cert from an existing Kubernetes secret. The chart mounts
  # the secret at /etc/nginx/redis-tls/ca/ca.crt and emits that path to
  # ssl_ca_cert. Required for managed Redis services that use a private
  # CA (e.g., GCP Memorystore).
  sslCaCertExistingSecret: ""
  sslCaCertExistingSecretKey: "ca.crt"
  # File path inside the container for the Redis client certificate (mTLS).
  sslClientCert: ""
  # Mount a client cert from an existing secret. Mounted at
  # /etc/nginx/redis-tls/cert/client.crt.
  sslClientCertExistingSecret: ""
  sslClientCertExistingSecretKey: "client.crt"
  # File path inside the container for the Redis client key (mTLS).
  sslClientKey: ""
  # Mount a client key from an existing secret. Mounted at
  # /etc/nginx/redis-tls/key/client.key.
  sslClientKeyExistingSecret: ""
  sslClientKeyExistingSecretKey: "client.key"

# Splunk HEC integration
splunk:
  enabled: false
  hecUrl: ""
  hecToken: ""
  # Name of existing secret containing Splunk HEC token
  existingSecret: ""
  existingSecretKey: "SPLUNK_HEC_TOKEN"
  index: "sfw-hec"
  source: "sfw-event"
  # Splunk sourcetype. Empty uses the firewall default (socket:firewall:event).
  sourcetype: ""
  # Verify TLS to the HEC endpoint.
  sslVerify: false
  # HEC request timeout (milliseconds).
  timeout: 5000
  # Events per HEC delivery (1 = send each event immediately).
  batchSize: 1

# Webhook event delivery (fires on package decisions)
webhook:
  enabled: false
  url: ""
  # Auth header sent to the webhook endpoint (e.g. "Authorization: Bearer <token>")
  authHeader: ""
  sslVerify: true
  timeout: 5000
  onBlock: true
  onWarn: true
  onMonitor: true
  onIgnore: false
  # Event batching: deliver events in batches instead of one request per decision
  batchEnabled: false
  # Max batch payload size in bytes (default: 512 KiB)
  batchSize: 524288
  # Batch flush interval in seconds
  batchPeriod: 5

# External registry cooldown — publish-date enforcement for ecosystems Socket does
# not natively support (e.g. Gradle plugins, private registries). Blocks packages
# published more recently than cooldownPeriod. Requires redis for shared state in
# multi-replica deployments.
externalRegistryCooldown:
  enabled: false
  # Allow direct public-registry fallback queries (legacy pre-cooldown-API
  # behavior). false (default): publish dates come from the Socket cooldown
  # API or a configured private registry only. true: public registries may
  # join the fallback chain (cooldown OR public).
  enablePublicQuery: false
  # Block packages published more recently than this window.
  cooldownPeriod: "7d"
  checkInterval: "60s"
  redisKeyPrefix: "cooldown:"
  cacheTtl: 86400
  # mode: empty auto-detects ('api' when socket.deployment is set, else 'local').
  mode: ""
  # fallback: '' (none), 'external', 'artifactory', or 'nexus'.
  fallback: ""
  # External registries to monitor. Each entry: name, url, ecosystem (required);
  # authType/authCredential/rateLimitHeader/ignoreSslErrors/timeout/cooldownPeriod optional.
  registries: []
  # - name: gradle-plugins
  #   url: https://plugins.gradle.org
  #   ecosystem: gradle
  #   authType: none            # 'none' | 'basic' | 'bearer'
  #   authCredential: ""        # env var name holding the credential
  #   rateLimitHeader: ""
  #   ignoreSslErrors: false
  #   timeout: 30
  #   cooldownPeriod: "7d"      # optional per-registry override
  # Cooldown queries against the configured private registry.
  privateRegistry:
    enabled: false
    authType: bearer_token      # 'bearer_token' | 'basic'
    authCredential: ""          # env var name
    source: auto                # 'auto' | 'artifactory' | 'nexus'
    # Only enforce cooldown on ecosystems Socket doesn't natively support.
    includeUnsupportedOnly: true
    includePattern: ".*"
    excludePattern: "^$"
    # cooldownPeriod: "7d"      # optional override for discovered repos

# Raw-config passthrough (advanced). Arbitrary keys merged verbatim into socket.yml
# as top-level YAML. Escape hatch for config keys the chart doesn't expose or new
# upstream sections. Do NOT repeat a section the chart already renders (socket:,
# nginx:, proxy:, cache:, etc.) — that yields duplicate YAML keys. Use it for whole
# sections the chart doesn't own.
extraConfig: {}
  # some_new_section:
  #   some_key: some_value

# Prometheus metrics
# The firewall serves metrics in Prometheus text format on a dedicated
# plain-HTTP listener. The endpoint has no built-in authentication and is
# reachable only in-cluster via the ClusterIP Service; restrict further with
# a NetworkPolicy if required.
metrics:
  # Expose the metrics port on the container and Service so it can be scraped.
  enabled: true
  # Minimum firewall image version that serves the /metrics endpoint. The
  # metrics port/annotations/ServiceMonitor are only rendered when the resolved
  # image tag is >= this (semver). Non-semver tags (e.g. "latest" or a digest)
  # are assumed new enough and are NOT gated out.
  minImageVersion: "1.1.343"
  # Port the firewall's /metrics listener binds to. Must match the firewall
  # image's metrics listener (currently fixed at 9145); changing this value
  # alone does not change what the container listens on.
  port: 9145
  # Add prometheus.io/{scrape,port,path} annotations to the pod for
  # annotation-based scrape discovery. Use this OR serviceMonitor, not both.
  podAnnotations: false
  serviceMonitor:
    # Create a Prometheus Operator ServiceMonitor. Requires the
    # monitoring.coreos.com CRDs to be installed in the cluster.
    enabled: false
    # Namespace for the ServiceMonitor; defaults to the release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels (e.g. to match your Prometheus serviceMonitorSelector).
    labels: {}
    honorLabels: false
    relabelings: []
    metricRelabelings: []

# Service configuration
service:
  type: ClusterIP
  httpPort: 80
  httpsPort: 443
  # Container listening ports (defaults to httpPort/httpsPort if not set)
  # Set these to use unprivileged ports (e.g., 8080/8443) when the Service
  # needs standard ports (80/443) for load balancer listeners
  containerHttpPort: ""
  containerHttpsPort: ""
  # Override HTTPS targetPort (set to "http" when TLS is terminated at the load balancer)
  httpsTargetPort: ""
  # External traffic policy (Cluster or Local). Only applies when type is
  # NodePort or LoadBalancer. Set to "Local" to preserve client source IPs;
  # the default "Cluster" policy SNATs traffic forwarded across nodes (e.g. to
  # a link-local 169.254.x.x address on GKE Dataplane v2 passthrough LBs).
  # Note: with "Local", only nodes running a firewall pod receive traffic.
  externalTrafficPolicy: ""
  annotations: {}
    # service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    # service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# Ingress configuration
ingress:
  enabled: false
  className: ""  # e.g., "nginx", "traefik", "alb"
  annotations: {}
    # For AWS ALB:
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internal
    # For nginx:
    # nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    # nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  hosts: []
    # - host: sfw.company.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []
    # - secretName: sfw-tls
    #   hosts:
    #     - sfw.company.com

# TLS configuration
tls:
  # Generate self-signed certificates (for testing)
  generateSelfSigned: true
  # Use existing secret with tls.crt and tls.key
  existingSecret: ""
  # Set to true when using cert-manager (remaps tls.crt/tls.key to fullchain.pem/privkey.pem)
  certManager: false
  # When certManager is true, also project ca.crt from the secret to /etc/nginx/ssl/ca.crt.
  # Set to false for ACME issuers like Let's Encrypt that don't populate a separate ca.crt
  # (the chain is already in tls.crt). Keep true for CA, SelfSigned, or Vault issuers if
  # you want ca.crt mounted in the pod for client trust extraction.
  includeCaCrt: true
  # Certificate data (base64 encoded, only used if generateSelfSigned is false and existingSecret is empty)
  certificate: ""
  privateKey: ""

# Resource limits
resources:
  # Defaults sized for metadata filtering: parsing large PyPI indexes (e.g.
  # aiohttp, ~10k files) can peak ~1GB per worker and OOMs the old 768Mi default.
  # Memory request == limit (Guaranteed QoS) so the pod isn't evicted/OOM-killed
  # under node pressure. Lower these if you don't run metadata filtering.
  limits:
    cpu: "4"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 8Gi

# Health check configuration.
# Note: the CONNECT listener (forwardProxy) shares the same nginx master
# process as the HTTP/HTTPS listeners, so this /health probe also covers it
# — if :3128 fails to bind, nginx won't start and the probe fails too.
healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

# Pod termination grace period (seconds). Empty = Kubernetes default (30s).
# When forwardProxy is enabled, set this >= forwardProxy.maxTunnelLifetimeSeconds
# so in-flight CONNECT tunnels aren't killed mid-stream on rollout/scale-down.
terminationGracePeriodSeconds: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext: {}
  # fsGroup: 101

# Container security context (PSS restricted profile)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Topology spread constraints (evenly distribute replicas across failure domains
# such as zones or nodes). Preferred over soft pod anti-affinity for even spreading.
# Empty by default; only takes effect with replicaCount > 1 or autoscaling enabled.
# The base field is GA since Kubernetes 1.19 (universally available). The optional
# matchLabelKeys field needs Kubernetes 1.27+ (satisfied by all current EKS/GKE versions).
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway   # use DoNotSchedule for a hard guarantee
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: socket-firewall
  #   # matchLabelKeys requires Kubernetes 1.27+
  #   # matchLabelKeys:
  #   #   - pod-template-hash

# Extra containers to run alongside the firewall (e.g., auth sidecars, log collectors)
extraContainers: []
# - name: auth-sidecar
#   image: my-org/auth-proxy:latest
#   ports:
#     - containerPort: 8443
#   env:
#     - name: UPSTREAM_PORT
#       value: "443"

# Init container configuration
initContainers:
  copyApp:
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
  certGenerator:
    image:
      repository: alpine/openssl
      tag: "3.3.2"
      pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

# Service account
serviceAccount:
  create: true
  name: ""
  annotations: {}
