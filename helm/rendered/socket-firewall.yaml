---
# Source: socket-firewall/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: socket-firewall-config
  labels:
    helm.sh/chart: socket-firewall-0.5.0
    app.kubernetes.io/name: socket-firewall
    app.kubernetes.io/instance: socket-firewall
    app.kubernetes.io/version: "1.1.346"
    app.kubernetes.io/managed-by: Helm
data:
  socket.yml: |
    # Socket API configuration
    socket:
      fail_open: true
      fail_open_unscanned: true
      use_remote_config: false
      config_refresh_interval: "60s"
      bearer_token_type: "string"
      telemetry_enabled: true
      telemetry_api_version: "v1"
      save_ignore_reason: false
      request_id_header: "X-Socket-Request-ID"
      expose_unscanned_header: false
      log_max_body_size: 3900
      log_no_route: true
      debug_logging_enabled: false
      rewrite_package_urls: true
    
    # Cache configuration
    cache:
      ttl: 600
    
    # Proxy configuration
    proxy:
      buffer_size: 16k
      buffers_count: 8
      buffers_size: 16k
      connect_timeout: 60
      send_timeout: 60
      read_timeout: 60
    
    nginx:
      worker_processes: 4
      worker_connections: 8192
      access_log_buffer: "off"
    path_routing:
      enabled: true
      domain: sfw.example.com
      routes:
        - path: /npm
          upstream: https://registry.npmjs.org
          registry: npm
        - path: /pypi
          upstream: https://pypi.org
          registry: pypi
    
    lua:
      cache_size: "10m"
      stats_size: "1m"

